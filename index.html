<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BGM Widget</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/ds-digital');
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nanum+Pen+Script&display=swap');

  :root{
    --lcd:#46ff35; --blue:#62b8f0;
    --cream:#e4ddcf; --cream-lo:#b9b1a0;
    --box-out:#6f5a3b; --box-in:#a58b62; --box-line:#94794f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;overflow-x:hidden}
  body{display:flex;justify-content:center;align-items:flex-start}
  button{font:inherit}

  /* 위젯 전체: 500 x 1104 (iframe 폭에 맞춰 비율대로 확대/축소) */
  .widget{position:relative;flex:none;width:500px;height:1138px;overflow:hidden;background:var(--box-out);user-select:none}

  /* ═════════ 카스테레오 페이스플레이트 ═════════ */
  .player{position:absolute;left:0;top:0;width:100%;height:215px;z-index:2;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,rgba(0,0,0,.04) 1px 2px),
      linear-gradient(180deg,#5a5a60 0%,#46464c 8%,#3d3d42 60%,#34343a 100%);
    border-bottom:4px solid #050505;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.6),0 5px 10px rgba(0,0,0,.55)}
  .player::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,rgba(255,255,255,.05) 0%,transparent 30%,transparent 70%,rgba(255,255,255,.03) 100%)}

  .side{position:absolute;top:11px;width:86px;height:194px;border-radius:4px;
    background:linear-gradient(180deg,#26262a,#323237);
    box-shadow:inset 0 0 0 1px #4a4a50,inset 0 3px 8px #000,0 1px 0 rgba(255,255,255,.1)}
  .side.l{left:8px}.side.r{right:8px}
  .strip{position:absolute;left:6px;right:6px;top:12px;height:30px;border-radius:2px;background:#101012;
    box-shadow:inset 0 0 0 1px #5a5a60,0 1px 0 rgba(255,255,255,.06);
    color:#f2efe6;font:600 6.5px/1 Arial,sans-serif;letter-spacing:.06em;
    display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 5px;white-space:nowrap}
  .strip div{display:flex;justify-content:space-between;align-items:center;gap:3px;font-size:5.5px;letter-spacing:.02em}
  .strip em{font-style:normal;font-size:9px}

  .knob{position:absolute;left:50%;top:62px;width:66px;height:66px;margin:-10px 0 0 -33px;border-radius:50%;cursor:default;
    background:
      radial-gradient(circle at 50% 50%,transparent 0 70%,rgba(0,0,0,.6) 100%),
      repeating-conic-gradient(#3a3a3e 0 3deg,#242427 3deg 6deg);
    box-shadow:0 0 0 2px #050505,0 0 0 3px #2c2c30,0 0 0 4px #09090a,0 8px 12px rgba(0,0,0,.8)}
  .knob .cap{position:absolute;inset:6px;border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
      radial-gradient(circle at 50% 50%,#424246 0%,#38383c 55%,#2a2a2e 100%);
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.5),0 0 0 1px #000}
  .knob .cap::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:9px;margin-left:-1.5px;border-radius:2px;
    background:#6a6a6f;box-shadow:0 0 0 1px rgba(0,0,0,.6)}

  .bezel{position:absolute;left:100px;top:11px;width:300px;height:194px;border-radius:8px;
    background:linear-gradient(180deg,#38383d,#2a2a2f);
    box-shadow:inset 0 0 0 1px #55555c,inset 0 2px 0 rgba(255,255,255,.1),0 0 0 2px #060607,0 6px 10px rgba(0,0,0,.6)}

  .window{position:absolute;left:44px;top:10px;width:212px;height:58px;border-radius:3px;
    background:linear-gradient(180deg,#0b0d12,#14171d);
    box-shadow:inset 0 0 0 2px #050506,inset 0 5px 10px #000,0 0 0 1px #3a3a40,0 1px 0 1px rgba(255,255,255,.1);overflow:hidden}
  .window::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(165deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.04) 35%,transparent 36%)}
  .blue{position:absolute;left:8px;right:8px;top:12px;height:32px;border:2px solid var(--blue);border-radius:2px;
    background:linear-gradient(180deg,rgba(30,70,120,.55),rgba(10,28,55,.7));
    box-shadow:0 0 8px rgba(98,184,240,.45),inset 0 0 8px rgba(98,184,240,.25);cursor:pointer}
  .blue b{position:absolute;left:7px;top:5px;color:#fff;font:italic 900 17px/1 'Arial Black',Impact,sans-serif;letter-spacing:-.04em;
    text-shadow:0 0 4px rgba(255,255,255,.35);transform:scaleX(.9);transform-origin:left}
  .blue .t1{position:absolute;left:58px;top:5px;color:#e9f3ff;font:600 6.5px/1 Arial,sans-serif;letter-spacing:.08em;white-space:nowrap}
  .blue .t2{position:absolute;left:58px;top:16px;color:#e9f3ff;font:600 6px/1 Arial,sans-serif;letter-spacing:.06em;white-space:nowrap}
  .blue .t2 i{display:inline-block;width:10px;height:6px;border:1px solid #e9f3ff;vertical-align:-1px;margin-right:2px}
  .blue .t3{position:absolute;right:6px;top:5px;color:#e9f3ff;font:600 7px/1 Arial,sans-serif;letter-spacing:.06em}
  .prog{position:absolute;left:6px;right:6px;bottom:4px;height:3px;background:rgba(98,184,240,.22);border-radius:2px}
  .prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue);border-radius:2px;box-shadow:0 0 6px var(--blue)}
  .slotgrill{position:absolute;left:50%;bottom:3px;width:44px;height:4px;margin-left:-22px;border-radius:2px;background:linear-gradient(180deg,#9a9a9a,#444)}

  .deco{position:absolute;width:20px;height:20px;border-radius:2px;
    background:linear-gradient(180deg,#eee8da,#c9c1b0);box-shadow:0 2px 0 #6c675c,0 3px 4px rgba(0,0,0,.6),inset 0 1px 0 #fff}
  .dl{position:absolute;color:#ece8dc;font:600 5.5px/1 Arial,sans-serif;letter-spacing:.05em;white-space:nowrap}

  .lcd{position:absolute;left:8px;right:8px;top:80px;height:56px;border-radius:3px;
    background:radial-gradient(ellipse at 50% 40%,#16281a,#050a06 85%);
    box-shadow:inset 0 0 0 2px #050506,inset 0 5px 12px #000,0 0 0 1px #3a3a40,0 1px 0 1px rgba(255,255,255,.1);
    display:flex;align-items:center;overflow:hidden}
  .lcd::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:linear-gradient(170deg,rgba(255,255,255,.11) 0%,transparent 38%),
      repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
  .lcd .lab{width:34px;padding-left:8px;color:#ece8dc;font:600 6px/1 Arial,sans-serif;letter-spacing:.05em;
    display:flex;flex-direction:column;gap:20px;flex:none;height:100%;justify-content:center}
  .lcd .lab span:first-child::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;
    background:#2a0b0b;margin-right:3px;vertical-align:1px}
  .playing .lcd .lab span:first-child::before{background:#ff3d2e;box-shadow:0 0 5px #ff3d2e}
  .marquee{position:relative;flex:1;min-width:0;overflow:hidden;white-space:nowrap;height:46px}
  .marquee .track{display:inline-flex;will-change:transform}
  .marquee span{display:inline-block;padding:0 22px 0 6px;
    font:40px/46px 'DS-Digital','Digital-7',monospace;letter-spacing:.07em;
    color:var(--lcd);text-shadow:0 0 6px rgba(70,255,53,.6),0 0 14px rgba(70,255,53,.25)}
  .marquee .track.run{animation:scroll var(--dur,10s) linear infinite}
  .marquee .track.paused{animation-play-state:paused}
  @keyframes scroll{to{transform:translateX(-50%)}}
  .lcd .ind{width:34px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .lcd .ind i{width:0;height:0;border-left:11px solid #11260f;border-top:7px solid transparent;border-bottom:7px solid transparent}
  .playing .lcd .ind i{border-left-color:var(--lcd);filter:drop-shadow(0 0 4px var(--lcd))}

  .keys{position:absolute;left:8px;right:8px;top:150px;display:flex;justify-content:space-between}
  .key{width:38px;text-align:center;color:#ece8dc;font:600 6px/1 Arial,sans-serif;letter-spacing:.06em}
  .btn{display:flex;width:38px;height:18px;border:0;padding:0;border-radius:2px;cursor:pointer;margin-bottom:9px;
    background:linear-gradient(180deg,#f0eadc 0%,var(--cream) 50%,var(--cream-lo) 100%);
    align-items:center;justify-content:center;
    box-shadow:0 3px 0 #6a655a,0 5px 5px rgba(0,0,0,.65),inset 0 1px 0 #fff;transition:transform .06s,box-shadow .06s}
  .btn svg{width:16px;height:12px;fill:#1a1a1a}
  .btn:hover{filter:brightness(1.07)}
  .btn:active,.btn.on{transform:translateY(2px);box-shadow:0 1px 0 #6a655a,inset 0 2px 3px rgba(0,0,0,.35)}
  #play.on svg{fill:#0b7a1f}
  #mute.on svg{fill:#c4271a}
  #mute .x{opacity:0}#mute.on .x{opacity:1}#mute.on .wave{opacity:0}

  /* ═════════ 브라운관 모니터 (위젯 안에 항상 놓임) ═════════ */
  .crt{position:absolute;left:0;right:0;top:219px;height:304px;z-index:1;display:flex;justify-content:center;align-items:center;
    background:
      radial-gradient(ellipse at 50% 0%,rgba(0,0,0,.45),transparent 70%),
      repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),
      linear-gradient(180deg,#2d2824,#1d1a18)}
  /* 진회색 미니 브라운관 TV */
  .win{position:relative;width:360px;font:600 10px/1 Arial,Helvetica,sans-serif;color:#d9d9dc;filter:drop-shadow(0 12px 12px rgba(0,0,0,.7))}
  .case{position:relative;padding:14px 14px 12px;border-radius:26px 26px 14px 14px;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),
      linear-gradient(180deg,#5b5b60 0%,#46464b 14%,#37373b 60%,#2b2b2f 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 2px 0 0 rgba(255,255,255,.07),
      inset -2px 0 0 rgba(0,0,0,.45),inset 0 -5px 0 rgba(0,0,0,.35),0 0 0 1px #0b0b0d}
  .case::before{content:"JVC";position:absolute;left:50%;top:3px;transform:translateX(-50%);
    font:italic 900 7px/1 'Arial Black',Impact,sans-serif;letter-spacing:.2em;color:#8e8e94;opacity:.7}
  .screenwrap{max-height:230px;overflow:hidden;transition:max-height .28s ease,margin .28s ease;margin-bottom:10px}
  .win.min .screenwrap{max-height:0;margin-bottom:0}
  .crt .bezel{position:static;left:auto;top:auto;width:auto;height:auto;padding:9px;border-radius:20px;
    background:linear-gradient(145deg,#1b1b1e,#2e2e33);
    box-shadow:inset 4px 4px 9px rgba(0,0,0,.85),inset -2px -2px 4px rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.18)}
  .glass{position:relative;width:320px;height:180px;margin:0 auto;border-radius:22px / 18px;overflow:hidden;background:#010402;
    box-shadow:0 0 0 2px #2a2924,0 0 0 3px rgba(255,255,255,.18),inset 0 0 22px #000}
  .body{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .body iframe{display:block;width:320px;height:180px;border:0}
  .scan{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.65) 100%);
    box-shadow:inset 0 0 28px rgba(0,0,0,.85);mix-blend-mode:multiply}
  .glare{position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:inherit;
    background:radial-gradient(ellipse 60% 38% at 28% 14%,rgba(255,255,255,.22),transparent 70%),
      linear-gradient(160deg,rgba(255,255,255,.06),transparent 40%)}
  .tint{position:absolute;inset:0;pointer-events:none;z-index:2;background:#2bff4a;mix-blend-mode:multiply;opacity:.6}
  .glass.boot{animation:crton .55s ease-out}
  @keyframes crton{0%{transform:scale(.2,.01);filter:brightness(6)}45%{transform:scale(1,.012);filter:brightness(5)}100%{transform:none;filter:none}}
  .msg{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    text-align:center;padding:16px;color:#46ff35;font:bold 18px/1.2 'DS-Digital','Courier New',monospace;letter-spacing:.14em;
    background:radial-gradient(ellipse at 50% 45%,#0f2a12 0%,#06130a 60%,#020804 100%);
    text-shadow:0 0 6px rgba(70,255,53,.8),0 0 16px rgba(70,255,53,.35);animation:flick 4s infinite}
  .msg[hidden]{display:none}
  .msg.click{cursor:pointer;z-index:5}
  .msg small{font:11px/1.7 'Courier New',monospace;letter-spacing:.02em;color:#46ff35;opacity:.85}
  .msg small::after{content:"_";animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.82}94%{opacity:1}96%{opacity:.9}}

  .ctrl{display:flex;flex-direction:column;gap:8px;padding:2px 4px 0}
  .row{display:flex;align-items:center;gap:7px}
  .led{width:7px;height:7px;border-radius:50%;flex:none;background:#3a1512;box-shadow:inset 0 1px 1px rgba(0,0,0,.7),0 0 0 1px #0b0b0d,0 1px 0 1px rgba(255,255,255,.12)}
  .win.on .led{background:#ff4a38;box-shadow:0 0 7px #ff4a38,0 0 0 1px #0b0b0d,0 1px 0 1px rgba(255,255,255,.12)}
  .tt{flex:1;min-width:0;font-weight:700;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:#c8c8cd;text-shadow:0 -1px 0 rgba(0,0,0,.7)}
  /* 눌러지는 회색 하드웨어 버튼 */
  .w98{min-width:24px;height:20px;padding:0 5px;border:0;border-radius:3px;cursor:pointer;color:#d9d9dc;
    font:bold 11px/1 Arial,Helvetica,sans-serif;
    background:linear-gradient(180deg,#5a5a60,#3b3b40);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 0 #0b0b0d,0 3px 4px rgba(0,0,0,.55)}
  .w98:hover{filter:brightness(1.15)}
  .w98:active{transform:translateY(2px);box-shadow:inset 0 1px 3px rgba(0,0,0,.6),0 0 0 #0b0b0d}
  .vlab{font-weight:700;color:#9b9ba2;letter-spacing:.1em;text-shadow:0 -1px 0 rgba(0,0,0,.7)}
  /* 스피커 슬릿 */
  .vents{flex:none;width:30px;height:16px;border-radius:2px;
    background:repeating-linear-gradient(0deg,#0d0d0f 0 2px,transparent 2px 4px);opacity:.9;box-shadow:0 1px 0 rgba(255,255,255,.1)}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:20px;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#121214;
    box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.12);border:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:18px;margin-top:-6.5px;border-radius:3px;border:0;
    background:linear-gradient(180deg,#d4d4d8,#8f8f95);box-shadow:0 1px 0 #000,0 2px 4px rgba(0,0,0,.6),inset 0 1px 0 #fff}
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#121214;box-shadow:inset 0 1px 2px #000}
  input[type=range]::-moz-range-thumb{width:12px;height:18px;border-radius:3px;border:0;background:linear-gradient(180deg,#d4d4d8,#8f8f95);box-shadow:0 1px 0 #000,0 2px 4px rgba(0,0,0,.6)}

  /* ═════════ 재생목록 박스 ═════════ */
  .box{position:absolute;left:0;top:523px;right:0;bottom:0;background:var(--box-out);z-index:2;box-shadow:0 -5px 10px rgba(0,0,0,.45)}
  .box::before{content:"";position:absolute;left:9px;right:9px;top:8px;bottom:34px;
    background:
      linear-gradient(var(--box-line) 1px,transparent 1px) 0 0/20px 20px,
      linear-gradient(90deg,var(--box-line) 1px,transparent 1px) 0 0/20px 20px,
      radial-gradient(ellipse at 50% 30%,rgba(255,235,190,.25),transparent 70%),
      var(--box-in);
    box-shadow:inset 0 0 0 4px rgba(0,0,0,.12),inset 0 8px 14px rgba(0,0,0,.35),inset 0 -10px 14px rgba(40,26,8,.45),inset 0 0 30px rgba(60,40,15,.3)}
  /* 받침대 프레임 */
  .box::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;
    background:var(--box-out);box-shadow:0 -3px 8px rgba(0,0,0,.35)}

  .tape{position:absolute;height:64px;border:0;padding:0;cursor:pointer;border-radius:4px 4px 6px 6px;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px),
      linear-gradient(180deg,#5b5b5d 0,#454547 6%,#3b3b3d 40%,#2e2e30 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 4px rgba(0,0,0,.35),
      0 5px 0 #1d1d1e,0 8px 8px rgba(0,0,0,.45);transition:transform .2s,filter .15s}
  .tape:hover{filter:brightness(1.2)}
  .tape .tab{position:absolute;top:18px;height:30px;border-radius:3px;
    background:linear-gradient(180deg,#232325,#3c3c3e);box-shadow:inset 0 2px 4px #000,0 1px 0 rgba(255,255,255,.18)}
  .tape .tab.l{left:10px;width:34px}
  .tape .tab.r{right:8px;width:18px;background:repeating-linear-gradient(0deg,#4a4a4c 0 2px,#252527 2px 4px)}
  .tape .label{position:absolute;top:8px;height:42px;border-radius:3px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 8px 0 14px;
    background:
      repeating-linear-gradient(0deg,transparent 0 13px,rgba(120,100,70,.08) 13px 14px),
      linear-gradient(180deg,#faf3de,#efe3c5 70%,#e4d6b4);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.12),0 -1px 2px rgba(0,0,0,.4)}
  .tape .label em{font:600 27px/1 'Caveat','Nanum Pen Script','Segoe Print','Bradley Hand',cursive;font-style:normal;
    color:#241d33;letter-spacing:.01em;white-space:nowrap;transform:rotate(-1.5deg);
    text-shadow:0 0 .5px rgba(36,29,51,.6);pointer-events:none}
  .tape.active{transform:translateX(12px);filter:brightness(1.3)}
  .tape.active .label{box-shadow:inset 0 0 0 2px var(--blue)}
  .tape:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>

<div class="widget" id="widget">
  <!-- 카스테레오 -->
  <section class="player">
    <div class="side l">
      <div class="strip"><div><em>◂</em><span>TREBLE</span><span>push BASS</span></div><div><span>OFF</span><span>VOLUME</span><span>push BAL</span></div></div>
      <div class="knob"><div class="cap"></div></div>
    </div>
    <div class="side r">
      <div class="strip"><div><span>FADER</span><em>▸</em></div><div><span>D ⌒ U</span><span>TUNING</span></div></div>
      <div class="knob"><div class="cap"></div></div>
    </div>
    <div class="bezel">
      <span class="dl" style="left:10px;top:9px">PROGRAM</span><span class="deco" style="left:12px;top:19px"></span>
      <span class="dl" style="left:10px;top:44px">DOLBY NR</span><span class="deco" style="left:12px;top:54px"></span>
      <span class="dl" style="left:262px;top:9px">STEREO/MONO</span><span class="deco" style="left:268px;top:19px"></span>
      <span class="dl" style="left:266px;top:44px">METAL</span><span class="deco" style="left:268px;top:54px"></span>
      <div class="window">
        <div class="blue" id="blue">
          <b>JVC</b><span class="t1">HI-POWER/AUTO REVERSE</span>
          <span class="t2"><i></i>DOLBY SYSTEM</span><span class="t3">KS-R7</span>
          <div class="prog"><i id="progfill"></i></div>
        </div>
        <div class="slotgrill"></div>
      </div>
      <div class="lcd">
        <div class="lab"><span>TAPE</span><span>BGM</span></div>
        <div class="marquee" id="marquee"><div class="track" id="mtrack"></div></div>
        <div class="ind"><i></i></div>
      </div>
      <div class="keys">
        <div class="key"><button class="btn" id="eject" title="Eject"><svg viewBox="0 0 24 18"><path d="M12 2 3 11h18zM3 13h18v3H3z"/></svg></button>EJECT</div>
        <div class="key"><button class="btn" id="prev" title="이전"><svg viewBox="0 0 24 18"><path d="M4 2h3v14H4zM20 2v14L8 9z"/></svg></button>PREV</div>
        <div class="key"><button class="btn" id="play" title="재생 / 일시정지"><svg viewBox="0 0 24 18"><path d="M2 2l8 7-8 7zM13 2h3.5v14H13zM19 2h3.5v14H19z"/></svg></button>PLAY</div>
        <div class="key"><button class="btn" id="stop" title="정지"><svg viewBox="0 0 24 18"><rect x="6" y="2" width="12" height="13"/></svg></button>STOP</div>
        <div class="key"><button class="btn" id="next" title="다음"><svg viewBox="0 0 24 18"><path d="M17 2h3v14h-3zM4 2l12 7L4 16z"/></svg></button>NEXT</div>
        <div class="key"><button class="btn" id="mute" title="음소거"><svg viewBox="0 0 24 18"><path d="M3 6h4l5-4v14l-5-4H3z"/>
          <path class="wave" d="M14.5 6a4 4 0 0 1 0 6M16.5 3.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
          <path class="x" d="M15 6l6 6M21 6l-6 6" fill="none" stroke="#c4271a" stroke-width="2" stroke-linecap="round"/></svg></button>MUTE</div>
      </div>
    </div>
  </section>

  <!-- 브라운관 모니터 -->
  <section class="crt">
    <div class="win" id="win">
      <div class="case">
        <div class="screenwrap"><div class="bezel"><div class="glass" id="glass">
          <div class="body"><div id="slot"></div>
            <div class="msg" id="msg">NO SIGNAL<small>PLAY 를 눌러 주세요</small></div></div>
          <div class="tint"></div><div class="scan"></div><div class="glare"></div>
        </div></div></div>
        <div class="ctrl">
          <div class="row"><span class="led"></span><span class="tt" id="tt">STANDBY</span>
            <button class="w98" id="bmin" title="최소화">&#95;</button><button class="w98" id="bx" title="정지">&#10005;</button></div>
          <div class="row"><span class="vlab">VOL</span><button class="w98" id="bmute" title="음소거">&#128266;</button>
            <input type="range" id="bvol" min="0" max="100" step="1" aria-label="볼륨"><span class="vents"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 재생목록 -->
  <section class="box" id="tapes"></section>
</div>

<script>
/* ═══════════ 설정 ═══════════ */
const tracks = [
  {title:'NO RETURN DATE', artist:'Mutonya',      yt:'wBIv3AtTZw8'},
  {title:'Against My Will',artist:'bonnierogerr', yt:'DHahkeAUEPQ'},
  {title:'Midnight Slave', artist:'bonnierogerr', yt:'01O2Pv37yzA'},
  {title:'CHEMICALS',      artist:'bonnierogerr', yt:'YaqDpsmSXZA'},
  {title:'Tears Ago',      artist:'bonnierogerr', yt:'okDw5WWPm7s'},
  {title:'BAD HABITS',     artist:'bonnierogerr', yt:'6VKYSTmZD3Y'},
  {title:'Toxic Sky',      artist:'bonnierogerr', yt:'wO5ZrjbH6Q0'},
  {title:'Fractured',      artist:'bonnierogerr', yt:'fD7UXpoTFvE'}
];
/* LCD 와 모니터 제목에는 "제목 - 작곡가" 가 나오고, 테이프 목록에는 제목만 나옵니다 */
const trackName=i=>{const t=tracks[i<0?0:i];return t.title+(t.artist?' - '+t.artist:'');};
const LAYOUT = [
  [68,377,44,44],[47,378,30,58],[50,405,45,68],[60,360,68,26],
  [50,395,45,60],[65,377,55,34],[45,383,28,64],[68,370,27,38]
];
/* ═════════════════════════ */

const $=id=>document.getElementById(id);
const widget=$('widget'), mtrack=$('mtrack');
const state={idx:-1,playing:false,pos:0,dur:0,vol:.7,muted:false};
try{const v=localStorage.getItem('bgm-vol'); if(v!==null) state.vol=Math.max(0,Math.min(1,+v));}catch(e){}

/* iframe 폭에 맞춰 위젯을 비율대로 키우고 줄임 */
function fit(){ widget.style.zoom=Math.max(.3,document.documentElement.clientWidth/500); }
addEventListener('resize',fit); fit();

/* 테이프 */
const tapesEl=$('tapes');
tracks.forEach((t,i)=>{
  const L=LAYOUT[i%LAYOUT.length];
  const b=document.createElement('button');
  b.className='tape';
  b.style.left=L[0]+'px'; b.style.width=L[1]+'px'; b.style.top=(38+i*66)+'px';
  const tabL=L[2]>=40?'<span class="tab l" style="width:'+Math.min(34,L[2]-18)+'px"></span>':'';
  const em=document.createElement('em'); em.textContent=t.title;
  b.innerHTML=tabL+'<span class="label" style="left:'+L[2]+'px;right:'+L[3]+'px"></span><span class="tab r"></span>';
  b.querySelector('.label').appendChild(em);
  b.setAttribute('aria-label',t.title);
  b.onclick=()=>select(i,true);
  tapesEl.appendChild(b);
});
const tapeEls=[...tapesEl.children];

/* LCD 마퀴 */
function buildMarquee(){
  mtrack.innerHTML='';
  const mk=()=>{const s=document.createElement('span');s.textContent=trackName(state.idx).toUpperCase();return s;};
  mtrack.append(mk(),mk());
  const w=mtrack.firstChild.offsetWidth||330;
  mtrack.style.setProperty('--dur',(w/70)+'s');
}
function marqueeRun(on){ mtrack.classList.toggle('run',on); mtrack.classList.remove('paused'); }
function marqueePause(){ mtrack.classList.add('paused'); }
buildMarquee();
(document.fonts?.ready||Promise.resolve()).then(buildMarquee);

/* ═════ YouTube 모니터 ═════ */
const crt=(()=>{
  let player=null,ready=false,cur='',pending=null,apiLoading=false,q=[],fb=0;
  const win=$('win'), msg=$('msg');

  function msgShow(t,s,click){ msg.hidden=false; msg.className='msg'+(click?' click':''); msg.innerHTML=t+'<small>'+s+'</small>'; }
  function msgHide(){ msg.hidden=true; msg.className='msg'; }
  msg.onclick=()=>{ if(msg.classList.contains('click')&&ready){ try{player.playVideo();}catch(e){} msgHide(); } };

  $('bmin').onclick=()=>{ win.classList.toggle('min'); const m=win.classList.contains('min');
    $('bmin').innerHTML=m?'&#9633;':'&#95;'; $('bmin').title=m?'펼치기':'최소화'; };
  $('bx').onclick=()=>stop();
  $('bmute').onclick=()=>$('mute').click();
  $('bvol').oninput=e=>{
    state.vol=e.target.value/100;
    if(state.muted){state.muted=false;$('mute').classList.remove('on');}
    applyVol();
  };

  function api(cb){
    if(window.YT&&YT.Player){cb();return;}
    q.push(cb);
    if(apiLoading) return; apiLoading=true;
    window.onYouTubeIframeAPIReady=()=>{ const f=q; q=[]; f.forEach(x=>x()); };
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
  function make(id,start){
    api(()=>{
      player=new YT.Player('slot',{
        width:'320',height:'180',videoId:id,
        playerVars:{autoplay:1,start:Math.floor(start||0),playsinline:1,rel:0,modestbranding:1},
        events:{
          onReady:e=>{ ready=true; sync();
            if(pending){ const p=pending; pending=null; e.target.loadVideoById({videoId:p.id,startSeconds:p.start||0}); }
            else e.target.playVideo(); },
          onStateChange:e=>{ if(e.data===0) onEnded(); if(e.data===1){ clearTimeout(fb); msgHide(); } }
        }
      });
    });
  }
  const active=()=>cur&&state.idx>=0&&tracks[state.idx].yt===cur;

  setInterval(()=>{
    if(!ready||!state.playing||!active()) return;
    try{ state.pos=player.getCurrentTime()||0; const d=player.getDuration(); if(d) state.dur=d; ui(); }catch(e){}
  },300);

  function sync(){
    $('bvol').value=Math.round(state.vol*100);
    $('bmute').innerHTML=(state.muted||state.vol===0)?'&#128263;':'&#128266;';
    if(ready){ try{ player.setVolume(Math.round(state.vol*100)); state.muted?player.mute():player.unMute(); }catch(e){} }
  }
  function show(idx){
    const was=!win.classList.contains('on'); win.classList.add('on');
    if(was){ const g=$('glass'); g.classList.remove('boot'); void g.offsetWidth; g.classList.add('boot'); }
    $('tt').textContent='T'+String(idx+1).padStart(2,'0')+'  '+trackName(idx);
    msgShow('LOADING','TUNING...');
  }
  function standby(){ win.classList.remove('on'); $('tt').textContent='STANDBY'; msgShow('NO SIGNAL','PLAY 를 눌러 주세요'); }
  function guard(){
    clearTimeout(fb);
    fb=setTimeout(()=>{
      if(!state.playing||!ready) return;
      let s=-1; try{s=player.getPlayerState();}catch(e){}
      if(s!==1&&s!==3) msgShow('PRESS HERE','화면을 눌러 재생',true);
    },3500);
  }
  function play(id,start){
    guard();
    if(!player){ cur=id; make(id,start); return; }
    if(!ready){ cur=id; pending={id,start}; return; }
    if(cur!==id){ cur=id; player.loadVideoById({videoId:id,startSeconds:start||0}); }
    else { if(start!=null) player.seekTo(start,true); player.playVideo(); }
  }
  function pause(){ win.classList.remove('on'); clearTimeout(fb); if(ready) try{player.pauseVideo();}catch(e){} }
  function seek(s){ if(ready) try{player.seekTo(s,true);}catch(e){} }
  return {show,standby,play,pause,seek,sync};
})();

function startEngine(){
  const vid=tracks[state.idx].yt;
  crt.show(state.idx);
  state.dur=0; crt.play(vid,state.pos);
}
function pauseEngine(){ crt.pause(); }
function onEnded(){ select((state.idx+1)%tracks.length,true); }

/* 동작 */
function select(i,autoplay){
  pauseEngine(); state.idx=i; state.pos=0; state.dur=0;
  autoplay?play():render();
}
function play(){ if(state.idx<0){state.idx=0;} state.playing=true;startEngine();render(); }
function pause(){ state.playing=false;pauseEngine();render(); }
function stop(){ state.playing=false;pauseEngine();state.pos=0;
  if(state.idx>=0) crt.seek(0);
  crt.standby(); render(); }
function prev(){
  if(state.idx<0)return;
  if(state.pos>3){seekTo(0);return;}
  select((state.idx-1+tracks.length)%tracks.length,true);
}
function next(){ select(((state.idx<0?-1:state.idx)+1)%tracks.length,true); }
function seekTo(sec){
  if(state.idx<0||!state.dur)return;
  state.pos=Math.max(0,Math.min(state.dur-.01,sec));
  crt.seek(state.pos); ui();
}

$('play').onclick=()=>state.playing?pause():play();
$('stop').onclick=stop; $('prev').onclick=prev; $('next').onclick=next;
$('eject').onclick=()=>{};   // 기능 없음
function applyVol(){ try{localStorage.setItem('bgm-vol',String(state.vol));}catch(e){} crt.sync(); }
$('mute').onclick=()=>{state.muted=!state.muted;$('mute').classList.toggle('on',state.muted);applyVol();};
$('blue').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  seekTo(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*state.dur);
};

/* UI */
function ui(){ $('progfill').style.width=(state.dur?state.pos/state.dur*100:0)+'%'; }
let lastShown=-2;
function render(){
  if(lastShown!==state.idx){lastShown=state.idx;buildMarquee();}
  widget.classList.toggle('playing',state.playing);
  $('play').classList.toggle('on',state.playing);
  tapeEls.forEach((el,i)=>el.classList.toggle('active',i===state.idx));
  if(state.playing)marqueeRun(true);
  else if(state.pos>0){marqueeRun(true);marqueePause();}
  else marqueeRun(false);
  ui();
}
crt.standby(); crt.sync(); render();
</script>
</body>
</html>
